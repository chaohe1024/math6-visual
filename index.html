<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="北师大版六年级上册数学可视化学习实验室：通过动态图形、互动实验和随堂练习理解数学知识。">
  <title>数学实验室｜六年级上册</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#home" aria-label="返回学习首页">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 40 40"><path d="M8 28 20 7l12 21Z"/><circle cx="20" cy="23" r="10"/></svg>
        </span>
        <span><strong>数学实验室</strong><small>MATH LAB · 6A</small></span>
      </a>
      <div class="book-label"><span>北师大版</span> 六年级上册</div>
      <nav class="unit-nav" id="unitNav" aria-label="单元导航"></nav>
      <div class="sidebar-progress">
        <div class="progress-ring" id="progressRing"><span id="progressNumber">0</span><small>/ 9</small></div>
        <div><strong>学习进度</strong><p>完成每单元的随堂闯关</p></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-button" id="menuButton" aria-label="打开单元导航">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div class="breadcrumb" id="breadcrumb">学习首页 <span>/</span> 探索数学</div>
        <button class="overview-button" id="overviewButton">
          <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
          知识地图
        </button>
      </header>
      <div class="content" id="app"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
